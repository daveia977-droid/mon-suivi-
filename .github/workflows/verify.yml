name: Mon Suivi — Vérifications
on:
  push:
    branches: [main, fix/v1-audit-nutrition-privacy, design/fusion-premium-maquettes-v2]
  pull_request:
    branches: [main]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Vérification de syntaxe
        run: |
          node --check app.js
          node --check meal-guide-data.js
          node --check recipe-preparations.js
          node --check alternative-portions.js
          node --check meal-guide.js
          node --check ciqual-2025.js
          node --check api/photo.js
          node --check pwa.js
          node --check sw.js
      - name: Tests de non-régression
        run: node tests/smoke.cjs

  visual:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer Chromium (Playwright)
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Tests visuels iPhone (393px, 320px, 430px)
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/mon-suivi-server.log 2>&1 &
          sleep 2
          node tests/e2e.cjs
          node tests/pwa.cjs
          node tests/phase2.cjs
      - name: Captures de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maquettes-fusion-premium
          path: screenshots/
          if-no-files-found: ignore

